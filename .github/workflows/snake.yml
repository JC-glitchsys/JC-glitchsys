
name: Generate GitHub Profile Graphics

on:
  schedule:
    - cron: "0 */12 * * *"

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate Snake and 3D Contributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate snake animations
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: JC-glitchsys
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      # Generate 3D contribution graphs
      - name: Generate 3D contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: JC-glitchsys

      # Fix permissions and organize generated files
      - name: Organize generated files
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist profile-3d-contrib
          mkdir -p dist/profile-3d-contrib
          cp -R profile-3d-contrib/. dist/profile-3d-contrib/

      # Deploy all graphics together
      - name: Deploy profile graphics
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update GitHub profile graphics"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
